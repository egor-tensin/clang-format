name: Test

on:
  push:
  schedule:
    # Weekly, at 00:30 UTC on Friday (somewhat randomly chosen).
    - cron: '30 00 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1

  test:
    strategy:
      matrix:
        version:
          - 17
          - 18
        style:
          - file
          - Chromium
        include:
          - {style: file, exclude: test/chromium.cpp}
          - {style: Chromium, exclude: test/file.cpp}
    runs-on: ubuntu-latest
    name: |
      Version: ${{ matrix.version }} / ${{ matrix.style }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: clang-format (success)
        uses: $/
        with:
          version: ${{ matrix.version }}
          style: ${{ matrix.style }}
          exclude: ${{ matrix.exclude }}
      - id: diff
        name: clang-format (fail)
        uses: $/
        with:
          version: ${{ matrix.version }}
          style: ${{ matrix.style }}
        continue-on-error: true
      - name: Verify diff
        env:
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          $basename = Split-Path '${{ matrix.exclude }}' -Leaf
          $original  = "$basename (original)"
          $formatted = "$basename (formatted)"
          $env:DIFF.Contains($original)  -or $(throw "Diff should contain: $original")
          $env:DIFF.Contains($formatted) -or $(throw "Diff should contain: $formatted")

  release:
    if: github.ref_type == 'tag'
    name: Release
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release
        uses: softprops/action-gh-release@v3
